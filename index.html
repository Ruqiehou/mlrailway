<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>慕联门户网站</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            line-height: 1.6;
            color: #1e293b;
            min-height: 100vh;
            background-color: #0f1117;
            background-image:
                radial-gradient(ellipse at 20% 0%, rgba(30, 58, 138, 0.15) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 100%, rgba(180, 134, 11, 0.1) 0%, transparent 60%),
                linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 40px 40px, 40px 40px;
        }

        /* ===== Hero 横幅 ===== */
        .hero {
            position: relative;
            padding: 3.5rem 2rem 2.5rem;
            text-align: center;
            overflow: hidden;
        }
        .hero::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(30, 58, 138, 0.25), rgba(180, 134, 11, 0.15));
            z-index: 0;
        }
        .hero::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,215,0,0.3), transparent);
        }
        .hero-content {
            position: relative;
            z-index: 1;
        }
        .hero h1 {
            font-size: 2.6rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffd700, #f0e68c, #ffd700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 0.15rem;
            margin-bottom: 0.4rem;
        }
        .hero .subtitle {
            font-size: 1.1rem;
            color: rgba(255,255,255,0.55);
            letter-spacing: 0.08rem;
        }

        /* ===== 金价实时小条 ===== */
        .gold-ticker {
            position: relative;
            z-index: 1;
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            margin-top: 1.2rem;
            padding: 0.5rem 1.4rem;
            background: rgba(255, 215, 0, 0.08);
            border: 1px solid rgba(255, 215, 0, 0.18);
            border-radius: 40px;
            font-size: 0.92rem;
            color: #e2d5a0;
            backdrop-filter: blur(6px);
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s;
        }
        .gold-ticker:hover {
            background: rgba(255, 215, 0, 0.15);
            border-color: rgba(255, 215, 0, 0.35);
            color: #ffd700;
        }
        .gold-ticker .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #ffd700;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        .gold-ticker .price { color: #ffd700; font-weight: 700; font-size: 1rem; }
        .gold-ticker .change-up { color: #4ade80; }
        .gold-ticker .change-down { color: #f87171; }

        /* ===== 搜索框 ===== */
        .search-wrap {
            max-width: 520px;
            margin: 1.8rem auto 0;
            position: relative;
        }
        .search-wrap input {
            width: 100%;
            padding: 0.75rem 1.2rem 0.75rem 2.8rem;
            font-size: 0.95rem;
            font-family: inherit;
            color: #e2e8f0;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 14px;
            outline: none;
            transition: all 0.3s;
        }
        .search-wrap input::placeholder { color: rgba(255,255,255,0.3); }
        .search-wrap input:focus {
            border-color: rgba(255,215,0,0.35);
            background: rgba(255,255,255,0.09);
            box-shadow: 0 0 0 3px rgba(255,215,0,0.08);
        }
        .search-wrap .search-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1rem;
            opacity: 0.4;
        }

        /* ===== 卡片网格 ===== */
        .main {
            max-width: 960px;
            margin: 0 auto;
            padding: 2rem 1.5rem 1rem;
        }
        .card-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.2rem;
        }

        /* ===== 卡片 ===== */
        .nav-card {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem 1.6rem;
            border-radius: 20px;
            text-decoration: none;
            color: inherit;
            cursor: pointer;
            transition: transform 0.35s cubic-bezier(.4,0,.2,1), box-shadow 0.35s;
            opacity: 0;
            transform: translateY(24px);
            animation: cardIn 0.5s ease forwards;
            overflow: hidden;
        }
        .nav-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.08);
            pointer-events: none;
        }
        .nav-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 16px 40px -12px rgba(0,0,0,0.4);
        }
        .nav-card:hover .card-icon {
            transform: scale(1.15) rotate(-5deg);
        }
        .nav-card:active { transform: translateY(-2px) scale(0.98); }

        @keyframes cardIn {
            to { opacity: 1; transform: translateY(0); }
        }
        .nav-card:nth-child(1) { animation-delay: 0.1s; }
        .nav-card:nth-child(2) { animation-delay: 0.2s; }
        .nav-card:nth-child(3) { animation-delay: 0.3s; }
        .nav-card:nth-child(4) { animation-delay: 0.4s; }

        .card-icon {
            font-size: 2.8rem;
            margin-bottom: 0.8rem;
            transition: transform 0.35s;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.2));
        }
        .card-title {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 0.35rem;
            letter-spacing: 0.04rem;
        }
        .card-desc {
            font-size: 0.82rem;
            opacity: 0.6;
            text-align: center;
            line-height: 1.4;
        }
        .card-intro {
            font-size: 0.78rem;
            opacity: 0.4;
            text-align: center;
            line-height: 1.5;
            margin-top: 0.5rem;
            max-width: 260px;
        }
        .card-arrow {
            position: absolute;
            top: 1rem;
            right: 1rem;
            font-size: 0.85rem;
            opacity: 0.25;
            transition: opacity 0.3s, transform 0.3s;
        }
        .nav-card:hover .card-arrow {
            opacity: 0.5;
            transform: translateX(3px);
        }

        /* 各卡片主题色 */
        .card-railway {
            background: linear-gradient(145deg, rgba(30, 64, 175, 0.35), rgba(30, 64, 175, 0.15));
        }
        .card-railway .card-title { color: #93b4f5; }

        .card-flight {
            background: linear-gradient(145deg, rgba(15, 118, 110, 0.35), rgba(15, 118, 110, 0.15));
        }
        .card-flight .card-title { color: #5eead4; }

        .card-quhua {
            background: linear-gradient(145deg, rgba(124, 58, 237, 0.35), rgba(124, 58, 237, 0.15));
        }
        .card-quhua .card-title { color: #c4b5fd; }

        .card-gold {
            background: linear-gradient(145deg, rgba(180, 134, 11, 0.35), rgba(180, 134, 11, 0.15));
        }
        .card-gold .card-title { color: #fde68a; }

        /* ===== 页脚 ===== */
        .footer {
            text-align: center;
            padding: 2rem 1rem 1.5rem;
            color: rgba(255,255,255,0.25);
            font-size: 0.8rem;
            letter-spacing: 0.04rem;
        }
        .footer .divider {
            width: 60px;
            height: 1px;
            background: rgba(255,255,255,0.1);
            margin: 0 auto 0.8rem;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 680px) {
            .hero { padding: 2.5rem 1.2rem 2rem; }
            .hero h1 { font-size: 1.8rem; letter-spacing: 0.08rem; }
            .hero .subtitle { font-size: 0.95rem; }
            .card-grid { grid-template-columns: 1fr; gap: 1rem; }
            .main { padding: 1.5rem 1rem 0.5rem; }
            .nav-card { padding: 1.6rem 1.2rem 1.3rem; flex-direction: row; justify-content: flex-start; gap: 1rem; text-align: left; }
            .card-icon { font-size: 2.2rem; margin-bottom: 0; }
            .card-text { flex: 1; }
            .card-desc { text-align: left; }
            .card-intro { text-align: left; max-width: none; }
            .search-wrap { margin-top: 1.2rem; }
        }
        @media (max-width: 400px) {
            .hero h1 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

    <!-- ===== Hero ===== -->
    <div class="hero">
        <div class="hero-content">
            <h1>慕联门户</h1>
            <p class="subtitle">在线生活一站式平台</p>

            <!-- 金价实时小条 -->
            <a href="gold.html" class="gold-ticker" id="goldTicker" style="display:none;">
                <span class="dot"></span>
                <span>实时金价</span>
                <span class="price" id="tickerPrice">--</span>
                <span id="tickerChange"></span>
            </a>

            <!-- 搜索框 -->
            <div class="search-wrap">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" placeholder="搜索功能…（铁路、机票、区划、金价）" autocomplete="off">
            </div>
        </div>
    </div>

    <!-- ===== 卡片网格 ===== -->
    <div class="main">
        <div class="card-grid" id="cardGrid">

            <a href="price_railway.html" target="_blank" rel="noopener noreferrer" class="nav-card card-railway" data-keywords="铁路 火车 票价 慕联铁路">
                <span class="card-arrow">→</span>
                <span class="card-icon">🚄</span>
                <div class="card-text">
                    <div class="card-title">慕联铁路</div>
                    <div class="card-desc">铁路票价查询系统</div>
                    <div class="card-intro">查询各线路火车票价，支持出发站与到达站快速检索，实时获取最新票价信息。</div>
                </div>
            </a>

            <a href="price_flight.html" target="_blank" rel="noopener noreferrer" class="nav-card card-flight" data-keywords="机票 飞机 航空 票价 慕联航空">
                <span class="card-arrow">→</span>
                <span class="card-icon">✈️</span>
                <div class="card-text">
                    <div class="card-title">慕联航空</div>
                    <div class="card-desc">机票票价查询系统</div>
                    <div class="card-intro">查询各航线机票价格，涵盖国内国际航班，一键获取最优票价方案。</div>
                </div>
            </a>

            <a href="quhua_query.html" target="_blank" rel="noopener noreferrer" class="nav-card card-quhua" data-keywords="区划 行政 地区 查询 地图">
                <span class="card-arrow">→</span>
                <span class="card-icon">🗺️</span>
                <div class="card-text">
                    <div class="card-title">行政区划</div>
                    <div class="card-desc">各级行政区划信息查询</div>
                    <div class="card-intro">逐级浏览帝国行政区划，从府州到县乡，清晰展示各级隶属关系与区划详情。</div>
                </div>
            </a>

            <a href="gold.html" target="_blank" rel="noopener noreferrer" class="nav-card card-gold" data-keywords="金价 黄金 交易 金玉满堂 价格">
                <span class="card-arrow">→</span>
                <span class="card-icon">💰</span>
                <div class="card-text">
                    <div class="card-title">金玉满堂</div>
                    <div class="card-desc">官方交易平台 · 实时金价</div>
                    <div class="card-intro">慕联官方贵金属交易平台，实时追踪金价走势，支持历史数据查看与一键复制报价。</div>
                </div>
            </a>

        </div>
    </div>

    <!-- ===== 页脚 ===== -->
    <div class="footer">
        <div class="divider"></div>
        <div>天狐慕氏联邦帝国 · 慕联门户</div>
        <div style="margin-top:0.2rem;">最后更新：<span id="lastUpdate">--</span></div>
    </div>

    <script>
    (function() {
        // ===== 搜索过滤 =====
        const searchInput = document.getElementById('searchInput');
        const cards = document.querySelectorAll('.nav-card');

        searchInput.addEventListener('input', function() {
            const q = this.value.toLowerCase().trim();
            cards.forEach(card => {
                const keywords = (card.dataset.keywords || '') + ' ' + card.textContent.toLowerCase();
                card.style.display = (!q || keywords.includes(q)) ? '' : 'none';
            });
        });

        // ===== 读取金价数据（从 gold.html 的表格 DOM 中解析） =====
        function loadGoldTicker() {
            fetch('gold.html')
                .then(r => r.text())
                .then(html => {
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(html, 'text/html');
                    const rows = doc.querySelectorAll('#priceData tbody tr');
                    const data = [];
                    rows.forEach(tr => {
                        const cells = tr.querySelectorAll('td');
                        if (cells.length >= 3) {
                            const price = parseFloat(cells[2].textContent.trim());
                            if (!isNaN(price)) {
                                data.push({
                                    date: cells[0].textContent.trim(),
                                    time: cells[1].textContent.trim(),
                                    price: price,
                                    isUp: cells[3].textContent.trim() === '涨'
                                });
                            }
                        }
                    });
                    if (data.length === 0) return;

                    const latest = data[data.length - 1];
                    const prev = data.length >= 2 ? data[data.length - 2] : null;

                    document.getElementById('tickerPrice').textContent = latest.price.toFixed(2);

                    const changeEl = document.getElementById('tickerChange');
                    if (prev) {
                        const diff = latest.price - prev.price;
                        const pct = (diff / prev.price * 100).toFixed(2);
                        const sign = diff >= 0 ? '+' : '';
                        changeEl.textContent = (diff >= 0 ? '▲' : '▼') + sign + diff.toFixed(2)
                            + ' (' + sign + pct + '%)';
                        changeEl.className = diff >= 0 ? 'change-up' : 'change-down';
                    }

                    document.getElementById('goldTicker').style.display = 'inline-flex';
                })
                .catch(() => {});
        }

        loadGoldTicker();

        // ===== 页脚更新时间 =====
        const now = new Date();
        const pad = n => String(n).padStart(2, '0');
        document.getElementById('lastUpdate').textContent =
            now.getFullYear() + '-' + pad(now.getMonth()+1) + '-' + pad(now.getDate())
            + ' ' + pad(now.getHours()) + ':' + pad(now.getMinutes());
    })();
    </script>
</body>
</html>
